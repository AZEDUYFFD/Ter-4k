
name: Temporary Public MediaMTX Stream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl jq

          # Download the latest MediaMTX Linux AMD64 release
          URL=$(curl -fsSL \
            https://api.github.com/repos/bluenviron/mediamtx/releases/latest \
            | jq -r '.assets[] |
              select(.name | test("linux_amd64\\.tar\\.gz$")) |
              .browser_download_url' | head -n 1)

          test -n "$URL"
          curl -fsSL "$URL" -o /tmp/mediamtx.tar.gz
          mkdir -p "$HOME/mediamtx"
          tar -xzf /tmp/mediamtx.tar.gz -C "$HOME/mediamtx"
          sudo install "$HOME/mediamtx/mediamtx" /usr/local/bin/mediamtx

          # Install cloudflared
          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo install /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Configure MediaMTX
        shell: bash
        run: |
          cat > mediamtx.yml <<'EOF'
          logLevel: info

          rtmp: yes
          rtmpAddress: :1935

          hls: yes
          hlsAddress: 127.0.0.1:8888

          webrtc: no
          srt: no

          authMethod: internal
          authInternalUsers:
            - user: any
              pass:
              ips: []
              permissions:
                - action: publish
                  path: stream
            - user: any
              pass:
              ips: []
              permissions:
                - action: read
                  path: stream

          paths:
            stream:
              source: publisher
          EOF

      - name: Start MediaMTX
        shell: bash
        run: |
          nohup mediamtx mediamtx.yml > mediamtx.log 2>&1 &
          echo $! > mediamtx.pid
          sleep 3
          cat mediamtx.log
          curl --retry 10 --retry-delay 2 --retry-connrefused \
            -fsS http://127.0.0.1:8888/ >/dev/null || true

      - name: Start public HTTPS tunnel
        shell: bash
        run: |
          cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:8888 \
            > cloudflared.log 2>&1 &
          echo $! > cloudflared.pid

          for i in $(seq 1 30); do
            URL=$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              echo "Temporary public URL: $URL"
              break
            fi
            sleep 2
          done

          cat cloudflared.log

      - name: Keep services running and show logs
        shell: bash
        run: |
          echo "OBS publishes to the runner's Tailscale IP on port 1935."
          echo "HLS path: /stream/index.m3u8"
          while true; do
            if ! kill -0 "$(cat mediamtx.pid)" 2>/dev/null; then
              echo "MediaMTX stopped"
              cat mediamtx.log
              exit 1
            fi
            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              echo "Cloudflare tunnel stopped"
              cat cloudflared.log
              exit 1
            fi
            sleep 15
          done

      - name: Print logs on failure
        if: failure()
        run: |
          cat mediamtx.log 2>/dev/null || true
          cat cloudflared.log 2>/dev/null || true
